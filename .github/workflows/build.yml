name: 构建与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
defaults:
  run:
    shell: pwsh
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            native: build/Release/maa-capture.dll
          - os: ubuntu-latest
            platform: linux-x64
            native: build/libmaa-capture.so
          - os: macos-latest
            platform: macos-arm64
            native: build/libmaa-capture.dylib
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/setup-node@v7
        with: {node-version: current}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/setup-dotnet@v6
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-go@v7
        with: {go-version: stable}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with: {toolchain: stable, cache: false}
      - name: Check project and generated ABI
        run: |
          python scripts/check-project.py
          if ($LASTEXITCODE) { throw 'Project check failed' }
          python scripts/generate-ffi.py --check
          if ($LASTEXITCODE) { throw 'Generated ABI differs from C header' }
          python tests/test_release_assets.py
          if ($LASTEXITCODE) { throw 'Provenance regression failed' }
      - id: version
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('bindings/python/pyproject.toml','rb'))['project']['version'])"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -cne "v$version") { throw 'Tag/version mismatch' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libdrm-dev libwayland-dev
      - name: Build and native regressions
        run: |
          $extra = if ($IsWindows) { @('-A','x64') } else { @() }
          cmake -S . -B build @extra
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { throw 'Build failed' }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'Native regression failed' }
          $savedPythonPath = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = (Resolve-Path bindings/python/src).Path
            python bindings/python/tests/test_binding.py (Resolve-Path '${{ matrix.native }}').Path
            if ($LASTEXITCODE) { throw 'Python regression failed' }
          } finally { $env:PYTHONPATH = $savedPythonPath }
      - name: FramePool disabled build and full tests
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build-no-framepool -A x64 -DMWS_ENABLE_FRAMEPOOL=OFF -DMWS_BUILD_SAMPLES=OFF
          if ($LASTEXITCODE) { throw 'Configure failed' }
          cmake --build build-no-framepool --config Release --parallel
          if ($LASTEXITCODE) { throw 'Build failed' }
          ctest --test-dir build-no-framepool -C Release --output-on-failure
          if ($LASTEXITCODE) { throw 'No-FramePool regression failed' }
      - name: Binding syntax and type checks
        run: |
          cargo check --locked --manifest-path bindings/rust/Cargo.toml --examples
          if ($LASTEXITCODE) { throw 'Rust check failed' }
          Push-Location bindings/nodejs
          try {
            npm install --no-package-lock --no-audit --no-fund
            if ($LASTEXITCODE) { throw 'npm failed' }
            npm run typecheck
            if ($LASTEXITCODE) { throw 'Node typecheck failed' }
          } finally { Pop-Location }
          ./bindings/java/fetch-jna.ps1
          javac -encoding UTF-8 -d bindings/java/build-classes -cp bindings/java/.deps/jna.jar bindings/java/NativeTypes.java bindings/java/MaaCapture.java bindings/java/Sample.java
          if ($LASTEXITCODE) { throw 'Java compile failed' }
          dotnet build bindings/csharp/test/test.csproj
          if ($LASTEXITCODE) { throw 'C# build failed' }
          $savedGoOS=$env:GOOS; $savedGoArch=$env:GOARCH; $savedCgo=$env:CGO_ENABLED
          Push-Location bindings/golang
          try {
            $env:GOOS='windows'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'
            go build ./...
            if ($LASTEXITCODE) { throw 'Go pure build failed' }
          } finally { $env:GOOS=$savedGoOS; $env:GOARCH=$savedGoArch; $env:CGO_ENABLED=$savedCgo; Pop-Location }
      - name: Windows binding callback and frame runtime tests
        if: runner.os == 'Windows'
        run: |
          $savedPath=$env:PATH; $savedLib=$env:LIB; $savedNative=$env:MAA_WS_LIB; $savedCgo=$env:CGO_ENABLED; $savedCC=$env:CC
          try {
            $nativeDir=(Resolve-Path build/Release).Path
            $env:PATH="$nativeDir;$env:PATH"; $env:LIB="$nativeDir;$env:LIB"; $env:MAA_WS_LIB="$nativeDir/maa-capture.dll"
            node bindings/nodejs/test.js
            if ($LASTEXITCODE) { throw 'Node runtime failed' }
            dotnet run --no-build --project bindings/csharp/test/test.csproj
            if ($LASTEXITCODE) { throw 'C# runtime failed' }
            java --enable-native-access=ALL-UNNAMED "-Djna.library.path=$nativeDir" -cp 'bindings/java/build-classes;bindings/java/.deps/jna.jar' maa.capture.Sample
            if ($LASTEXITCODE) { throw 'Java runtime failed' }
            cargo run --locked --manifest-path bindings/rust/Cargo.toml --example demo
            if ($LASTEXITCODE) { throw 'Rust runtime failed' }
            $env:LIB=$savedLib
            $env:CGO_ENABLED='1'
            $env:PATH="C:/Program Files/LLVM/bin;$env:PATH"; $env:CC='clang -fuse-ld=lld'
            Push-Location bindings/golang
            try {
              go run ./test
              if ($LASTEXITCODE) { throw 'Go cgo runtime failed' }
            } finally { Pop-Location }
          } finally { $env:PATH=$savedPath; $env:LIB=$savedLib; $env:MAA_WS_LIB=$savedNative; $env:CGO_ENABLED=$savedCgo; $env:CC=$savedCC }
      - name: Package SDK with binary manifest
        run: |
          python scripts/package-sdk.py --platform '${{ matrix.platform }}'
          if ($LASTEXITCODE) { throw 'SDK packaging failed' }
      - name: Consume extracted SDK
        run: |
          python scripts/verify-sdk.py dist --platform '${{ matrix.platform }}'
          if ($LASTEXITCODE) { throw 'Extracted SDK verification failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: native/
          if-no-files-found: error
  python-binding:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: astral-sh/setup-uv@main
      - uses: actions/download-artifact@v8
        with: {pattern: 'native-*', path: native, merge-multiple: true}
      - name: Build aggregated wheel, sdist, full source and provenance
        run: |
          Copy-Item native/* bindings/python/src/maa_capture/_native/ -Recurse -Force
          uv build bindings/python --out-dir dist
          if ($LASTEXITCODE) { throw 'Python package failed' }
          uv run --python 3.12 --no-project scripts/check-python-dist.py dist --require-native
          if ($LASTEXITCODE) { throw 'Distribution verification failed' }
          python scripts/create-source-archive.py
          if ($LASTEXITCODE) { throw 'Source archive failed' }
      - uses: actions/download-artifact@v8
        with: {pattern: 'sdk-*', path: dist, merge-multiple: true}
      - name: Verify complete assets and hashes
        run: |
          python scripts/check-release-assets.py dist --version '${{ needs.build.outputs.version }}' --native native --create
          if ($LASTEXITCODE) { throw 'Release provenance verification failed' }
      - uses: actions/upload-artifact@v7
        with: {name: release-assets, path: 'dist/*', if-no-files-found: error}
  source-rebuild:
    needs: [build, python-binding]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: {os: [windows-latest, ubuntu-latest, macos-latest]}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.x'}
      - uses: actions/download-artifact@v8
        with: {name: release-assets, path: dist}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libdrm-dev libwayland-dev
      - name: Build exclusively from source asset and run installed consumer
        run: |
          python scripts/verify-source-archive.py dist
          if ($LASTEXITCODE) { throw 'Source archive rebuild failed' }
  final-wheel:
    needs: [build, python-binding]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.12', '3.x']
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/download-artifact@v8
        with: {name: release-assets, path: dist}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-0 libwayland-client0
      - name: Install final wheel and exercise bundled ABI, callbacks and errors
        run: |
          python -m venv wheel-venv
          $python=if($IsWindows){'wheel-venv/Scripts/python.exe'}else{'wheel-venv/bin/python'}
          $wheel=(Get-ChildItem dist/*.whl).FullName
          & $python -m pip install $wheel
          if ($LASTEXITCODE) { throw 'Wheel installation failed' }
          & $python bindings/python/tests/test_binding.py
          if ($LASTEXITCODE) { throw 'Final wheel runtime failed' }
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, python-binding, final-wheel, source-rebuild]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v8
        with: {name: release-assets, path: dist}
      - run: |
          python scripts/check-release-assets.py dist --version '${{ needs.build.outputs.version }}'
          if ($LASTEXITCODE) { throw 'Release verification failed' }
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.7z
            dist/*.tar.gz
            dist/*.whl
            dist/*-provenance.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [final-wheel, source-rebuild]
    runs-on: ubuntu-latest
    environment: pypi
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with: {name: release-assets, path: dist}
      - name: Select Python distributions
        run: |
          New-Item -ItemType Directory -Force dist-pypi | Out-Null
          Copy-Item dist/maa_capture-* dist-pypi/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: env.PYPI_API_TOKEN != ''
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist-pypi/
